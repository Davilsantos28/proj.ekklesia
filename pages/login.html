<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ekklesia | Login</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
<link rel="stylesheet" href="../css/autenticacao.css">
    <script type="module" src="../js/login.js"></script>
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo-area">

                <img
                    src="../assets/logo.jpeg"
                    alt="Logo Ekklesia"
                >

                <h1>EKKLESIA</h1>

                <p>Gestão para Comunidades</p>

            </div>


            <form id="login-form" method="post">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email" autocomplete="email" required
                        placeholder="Digite seu e-mail"
                    >

                </div>



                <div class="form-group">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha" autocomplete="current-password" required
                        placeholder="Digite sua senha"
                    >
                </div>

                <p id="auth-feedback" class="auth-feedback" role="status" aria-live="polite" tabindex="-1" hidden></p>
                <button type="submit" id="submit-auth" disabled>
                    Entrar
                </button>

                <button type="button" class="text-button" id="reset-password" disabled>Esqueci minha senha</button>
                <a href="cadastro.html">Ainda não tem conta? Cadastre-se</a>
                <p id="connection-note" class="field-help">Preparando conexão… Se esta mensagem persistir, verifique sua conexão e recarregue a página.</p>
                <noscript>Ative o JavaScript para entrar.</noscript>

            </form>

        </section>


        <div class="versiculo">

            <p>
                "E todos uma só coisa. Como tu, ó Pai, estás em mim,
                e eu em ti."
            </p>

            <span>
                João 17:21
            </span>

        </div>

    </main>


    <footer>

        <p>
            © 2025 Ekklesia - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
